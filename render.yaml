databases:
  - name: ai-ml-portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: free

services:
  - type: web
    name: ai-ml-portfolio
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://www-aditya-portfolio-com.onrender.com,https://ai-ml-portfolio.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ml-portfolio-db
          property: connectionString