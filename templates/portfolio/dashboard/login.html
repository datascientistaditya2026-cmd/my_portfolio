```html
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard Login | AI/ML Portfolio</title>

    <link rel="stylesheet"
          href="{% static 'css/dashboard.css' %}">

</head>


<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                AI
            </div>

            <h1>
                Portfolio Dashboard
            </h1>

            <p class="login-subtitle">
                Sign in to manage your portfolio
            </p>


            {% if messages %}

                {% for message in messages %}

                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button type="submit"
                        class="login-btn">

                    Login to Dashboard

                </button>

            </form>


            <a href="{% url 'home' %}"
               class="back-home">

                ← Back to Portfolio

            </a>

        </div>

    </div>

</body>

</html>
```
